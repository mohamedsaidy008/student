<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>منظومة استخراج جدول خاص</title>
    <style>
        :root {
            font-family: Tahoma, Arial, sans-serif;
            color: #17233b;
            background: #f5f7fb
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0
        }

        button,
        input {
            font: inherit
        }

        button {
            cursor: pointer
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .top {
            padding: 18px 24px;
            background: #152943;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .brand {
            font-weight: 800;
            font-size: 21px
        }

        .top small {
            color: #b9cbe0
        }

        main {
            max-width: 1190px;
            margin: 0 auto;
            padding: 28px 18px 40px
        }

        .hero {
            max-width: 660px;
            margin: 8vh auto 10vh;
            text-align: center
        }

        .hero h1 {
            font-size: clamp(27px, 4vw, 40px);
            margin: 0 0 28px;
            line-height: 1.6
        }

        .primary {
            border: 0;
            background: #245bd6;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            font-weight: bold
        }

        .primary:hover {
            background: #1d4fbd
        }

        .secondary {
            border: 1px solid #c9d5e5;
            background: #fff;
            color: #243e62;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold
        }

        .secondary:hover {
            background: #edf3fd
        }

        .danger {
            border-color: #e7c6c6;
            color: #a93636
        }

        .hero .primary {
            font-size: 18px;
            padding: 17px 44px
        }

        .import-area {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap
        }

        .muted {
            color: #667891;
            font-size: 13px
        }

        .panel {
            background: white;
            border: 1px solid #dfe6ef;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 8px 26px #192a4b08
        }

        .hidden {
            display: none !important
        }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px
        }

        .bar h2 {
            font-size: 20px;
            margin: 0
        }

        .bar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
            gap: 11px
        }

        .subject {
            border: 1px solid #dce5f1;
            border-radius: 11px;
            padding: 13px;
            background: #fff
        }

        .subject.active {
            border-color: #80a5ec;
            background: #f5f8ff
        }

        .subject-head {
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            font-weight: bold
        }

        .subject-head input {
            accent-color: #245bd6;
            width: 17px;
            height: 17px
        }

        .groups {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: 12px;
            padding-top: 11px;
            border-top: 1px solid #e6edf6
        }

        .group {
            position: relative
        }

        .group input {
            position: absolute;
            opacity: 0;
            pointer-events: none
        }

        .group span {
            display: inline-block;
            border: 1px solid #cbd8e9;
            background: white;
            padding: 7px 12px;
            border-radius: 7px;
            cursor: pointer;
            min-width: 35px;
            text-align: center;
            font-size: 13px
        }

        .group input:checked+span {
            background: #245bd6;
            color: white;
            border-color: #245bd6
        }

        .group input:focus-visible+span {
            outline: 2px solid #17233b
        }

        .selection-footer {
            position: sticky;
            bottom: 12px;
            background: #fff;
            border: 1px solid #dfe6ef;
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 8px 25px #192a4b1c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px
        }

        .selection-footer b {
            font-size: 14px
        }

        .table-scroll {
            overflow-x: auto;
            border: 1px solid #c7d1df;
            border-radius: 7px
        }

        .schedule-table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
            min-width: 790px;
            background: white
        }

        .schedule-table th,
        .schedule-table td {
            border: 1px solid #bdc9d8;
            padding: 7px 5px;
            text-align: center;
            vertical-align: middle
        }

        .schedule-table thead th {
            background: #2c405d;
            color: #fff;
            font-size: 13px;
            padding: 12px 6px
        }

        .schedule-table thead th:first-child {
            width: 93px
        }

        .schedule-table tbody th {
            background: #e1e7f0;
            color: #20324b;
            font-size: 14px
        }

        .schedule-table tbody td {
            height: 84px
        }

        .lesson {
            border-radius: 6px;
            padding: 8px 5px;
            margin: 3px 0;
            border: 1px solid #00000016;
            break-inside: avoid;
            line-height: 1.5
        }

        .lesson strong {
            display: block;
            font-size: 12px
        }

        .lesson span {
            display: block;
            font-size: 11px;
            margin-top: 3px
        }

        .emptycell {
            color: #c5ccd7
        }

        .conflict {
            outline: 2px solid #e25555;
            outline-offset: -2px
        }

        .warning {
            background: #fff1ed;
            border: 1px solid #f2b7a8;
            color: #a33525;
            padding: 10px 14px;
            border-radius: 9px;
            margin: 13px 0;
            font-size: 13px
        }

        .table-title {
            margin: 0 0 15px;
            text-align: center;
            font-size: 19px
        }

        .table-meta {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin: -4px 0 16px
        }

        .chip {
            background: #eaf0f9;
            border-radius: 20px;
            padding: 5px 10px;
            color: #3a526f;
            font-size: 12px
        }

        .end {
            text-align: center;
            color: #667891;
            padding: 12px 16px 30px;
            font-size: 13px
        }

        .end a {
            color: #245bd6;
            text-decoration: none;
            font-weight: bold
        }

        .end a:hover {
            text-decoration: underline
        }

        .end p {
            margin: 6px 0
        }

        .toast {
            position: fixed;
            bottom: 18px;
            left: 18px;
            background: #192d4b;
            color: white;
            border-radius: 9px;
            padding: 11px 17px;
            z-index: 20;
            display: none;
            max-width: 90%
        }

        #jsonFile {
            display: none
        }

        @media(max-width:600px) {
            .top {
                padding: 16px
            }

            .brand {
                font-size: 17px
            }

            .panel {
                padding: 15px
            }

            .hero {
                margin: 10vh auto
            }

            .bar-actions button {
                flex: 1
            }

            .schedule-table tbody td {
                height: 74px
            }
        }

        @page {
            size: A4 landscape;
            margin: 8mm
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important
            }

            html,
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important
            }

            .top,
            .no-print,
            .end,
            .toast {
                display: none !important
            }

            main {
                max-width: none;
                margin: 0;
                padding: 0
            }

            .panel {
                border: 0;
                box-shadow: none;
                padding: 0;
                margin: 0
            }

            .table-scroll {
                overflow: visible;
                border: 0
            }

            .schedule-table {
                min-width: 0 !important;
                width: 100% !important;
                table-layout: fixed
            }

            .schedule-table th,
            .schedule-table td {
                border-color: #7c8798 !important;
                padding: 3px 2px !important
            }

            .schedule-table thead th {
                font-size: 9px !important;
                padding: 7px 2px !important
            }

            .schedule-table thead th:first-child {
                width: 64px
            }

            .schedule-table tbody th {
                font-size: 10px !important
            }

            .schedule-table tbody td {
                height: 64px !important
            }

            .lesson {
                padding: 3px 2px !important;
                margin: 2px 0 !important;
                border-radius: 3px !important
            }

            .lesson strong {
                font-size: 9px !important
            }

            .lesson span {
                font-size: 8px !important;
                margin-top: 1px !important
            }

            .table-title {
                font-size: 16px;
                margin-bottom: 9px
            }

            .table-meta {
                margin-bottom: 8px
            }

            .chip {
                font-size: 9px;
                padding: 2px 7px
            }

            .warning {
                font-size: 9px;
                padding: 5px;
                margin: 5px 0
            }

            .print-only {
                display: block !important
            }

            #home,
            #choose {
                display: none !important
            }

            #result {
                display: block !important
            }

            tr {
                break-inside: avoid
            }
        }
    </style>
</head>

        <div class="brand">منظومة استخراج جدول خاص</div><small>Artitech Studio</small>
    </header>
    <main>
        <section id="home" class="hero no-print">
            <h1>منظومة استخراج جدول خاص</h1>
            <button class="primary" id="start">أنشئ جدولك</button>
            <div class="import-area"><button class="secondary" id="importHome">ارفع ملف JSON</button><button
                    class="secondary" id="exportHome">تصدير JSON</button></div>
        </section>
        <section id="choose" class="hidden no-print">
            <div class="panel">
                <div class="bar">
                    <h2>اختر موادك ومجموعاتك</h2>
                    <div class="bar-actions"><button class="secondary" id="backHome">الرئيسية</button><button
                            class="secondary" id="reset">مسح الاختيارات</button></div>
                </div>
                <div class="subjects" id="subjects"></div>
            </div>
            <div class="selection-footer"><b id="selectedCount">0 مواد</b><button class="primary" id="make">عرض
                    الجدول</button></div>
        </section>
        <section id="result" class="hidden">
            <div class="bar no-print">
                <h2>جدولك الدراسي</h2>
                <div class="bar-actions"><button class="secondary" id="edit">تعديل الاختيارات</button><button
                        class="secondary" id="importResult">رفع JSON</button><button class="secondary"
                        id="exportResult">تصدير JSON</button><button class="primary" id="pdf">حفظ PDF</button></div>
            </div>
            <div class="panel">
                <h2 class="table-title">الجدول الدراسي الخاص</h2>
                <div id="selectedNames" class="table-meta"></div>
                <div id="warnings"></div>
                <div class="table-scroll">
                    <table class="schedule-table" id="timetable">
                        <thead id="thead"></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <footer class="end no-print">
        <p>شكراً لاستخدامك الموقع</p>
        <p>الموقع من إنتاج <strong>Artitech Studio</strong></p>
        <p><a href="https://www.instagram.com/artiatechstudio/" target="_blank" rel="noopener">إنستجرام</a> · <a
                href="https://www.youtube.com/@artiatechstudio" target="_blank" rel="noopener">يوتيوب</a></p>
    </footer>
    <input id="jsonFile" type="file" accept=".json,application/json">
    <div class="toast" id="toast"></div>

        function colorFor(id) { let i = source.subjects.findIndex(s => s.id === id); return palettes[(i < 0 ? 0 : i) % palettes.length] }
        function getLessons() { return source.schedule.filter(x => Object.hasOwn(chosen, x.subjectId) && (x.group === null || chosen[x.subjectId].includes(x.group))) }
        function renderTable() { const lessons = getLessons(), subjectMap = new Map(source.subjects.map(s => [s.id, s])), roomMap = new Map(source.rooms.map(r => [r.id, r])); $('selectedNames').innerHTML = Object.keys(chosen).map(id => subjectMap.get(id)?.name).filter(Boolean).map(n => `<span class="chip">${escapeHtml(n)}</span>`).join(''); $('thead').innerHTML = '<tr><th>اليوم</th>' + source.periods.map(p => `<th>${escapeHtml(p.time)}</th>`).join('') + '</tr>'; let conflicts = []; $('tbody').innerHTML = source.days.map(day => '<tr><th scope="row">' + escapeHtml(day) + '</th>' + source.periods.map(period => { const entries = lessons.filter(x => x.day === day && x.period === period.id); if (entries.length > 1) conflicts.push(day + '، ' + period.time); return `<td class="${entries.length > 1 ? 'conflict' : ''}">${entries.length ? entries.map(x => `<div class="lesson" style="background:${colorFor(x.subjectId)}"><strong>${escapeHtml(subjectMap.get(x.subjectId)?.name || '')}</strong><span>${x.group !== null ? 'المجموعة ' + escapeHtml(x.group) + ' · ' : ''}${escapeHtml(roomMap.get(x.roomId)?.name || '')}</span></div>`).join('') : '<span class="emptycell">—</span>'}</td>` }).join('') + '</tr>').join(''); $('warnings').innerHTML = conflicts.length ? `<div class="warning">تعارض في: ${escapeHtml(conflicts.join(' | '))}</div>` : '' }
        function makeTable() { if (!Object.keys(chosen).length) return toast('اختر مادة واحدة على الأقل'); for (const s of source.subjects) { if (Object.hasOwn(chosen, s.id) && s.groups.length && !chosen[s.id].length) return toast('اختر مجموعة لمادة ' + s.name) } renderTable(); show('result') }
        function downloadJSON() { const blob = new Blob([JSON.stringify(source, null, 2)], { type: 'application/json;charset=utf-8' }), url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = 'study_schedule.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000) }
        $('start').onclick = () => { drawSubjects(); show('choose') }; $('backHome').onclick = () => show('home'); $('reset').onclick = () => { chosen = {}; saveChoices(); drawSubjects() }; $('make').onclick = makeTable; $('edit').onclick = () => { drawSubjects(); show('choose') }; $('pdf').onclick = () => window.print(); $('exportHome').onclick = downloadJSON; $('exportResult').onclick = downloadJSON;
        for (const id of ['importHome', 'importResult']) $(id).onclick = () => $('jsonFile').click();
        $('jsonFile').onchange = async e => { const f = e.target.files?.[0]; if (!f) return; try { const d = JSON.parse(await f.text()); if (!valid(d)) throw Error('الملف غير متوافق'); source = d; chosen = {}; saveChoices(); drawSubjects(); show('choose'); toast('تم استيراد الجدول') } catch (err) { toast('تعذّر فتح الملف: ' + err.message) } finally { e.target.value = '' } };
    </script>
</body>
